<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kv</title>
<style>
  body { font: 13px monospace; margin: 1em; }
  table { border-collapse: collapse; margin: .5em 0 1.5em; }
  td, th { border: 1px solid #ccc; padding: 2px 6px; text-align: left; vertical-align: top; }
  textarea { width: 40em; height: 4em; font: inherit; display: block; }
  label { white-space: nowrap; }
  .del { opacity: .4; }
  h2 { margin: 1em 0 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const first = decodeURIComponent(location.pathname.split("/")[1]);
const domain = first === "_" ? "" : first; // "" on /_/
const app = document.getElementById("app");
let token = localStorage.getItem("kv-token");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
const str = (s) => esc(JSON.stringify(s)); // JS string literal inside an HTML attribute
const split = (list) => (list ? list.split(",") : []);

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: body && JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401) logout();
  if (!res.ok) throw new Error(json.error || json.message || res.status);
  return json;
}

// run an action, show errors, re-render
const act = (fn) => fn().then(render).catch((e) => alert(e.message));

// all inputs of a row, marked with data-row="<id>"
const row = (id) => [...document.querySelectorAll("[data-row]")].filter((e) => e.dataset.row === String(id));

// nothing changes until a row's save button is clicked
function saveUser(id) {
  const body = { domain: [] };
  for (const c of row("user-" + id)) {
    if (c.name === "domain") c.checked && body.domain.push(c.value);
    else body[c.name] = c.checked;
  }
  act(() => api("PUT", `/admin/users/${id}`, body));
}

function saveData(key) {
  const [value, del] = row("data-" + key);
  const path = `/${domain}/data/${encodeURIComponent(key)}`;
  if (del.checked) confirm("delete key?") && act(() => api("DELETE", path));
  else act(() => api("PUT", path, { value: value.value }));
}

function saveDomain(name) {
  const [del] = row("domain-" + name);
  if (del.checked && confirm("delete domain?")) act(() => api("DELETE", `/admin/domains/${encodeURIComponent(name)}`));
}

function logout() {
  token = null;
  localStorage.removeItem("kv-token");
  render();
}

async function login(form) {
  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: form.username.value, password: form.password.value }),
  });
  const json = await res.json();
  if (!res.ok) return alert(json.error);
  token = json.token;
  localStorage.setItem("kv-token", token);
  render();
}

async function render() {
  if (!token) {
    app.innerHTML = `<h1>kv / ${esc(domain)}</h1>
      <form onsubmit="event.preventDefault(); login(this)">
        <input name="username" placeholder="username">
        <input name="password" type="password" placeholder="password">
        <button>login</button>
      </form>`;
    return;
  }

  const me = (await api("GET", "/users/me")).user;
  // checkbox of a user row; own active/admin/deleted can't be changed
  const check = (u, name, { value = "", checked = u[name], hidden = false } = {}) =>
    `<input type="checkbox" name="${name}" value="${esc(value)}" data-row="user-${u.id}"
      ${checked ? "checked" : ""} ${hidden ? "hidden" : ""} ${u.id === me.id && name !== "domain" ? "disabled title='own user'" : ""}>`;
  const saveUserButton = (u) => `<button onclick="saveUser(${u.id})">save</button>`;

  let html = `<h1><a href="/_/">kv</a>${domain ? " / " + esc(domain) : ""}</h1>
    <p>${esc(me.username)}${me.isAdmin ? " (admin)" : ""} <button onclick="logout()">logout</button></p>`;

  if (!domain) {
    // overview: all domains and users
    if (!me.isAdmin) {
      app.innerHTML = html + "<p>open /{domain}/_/ to see your data</p>";
      return;
    }
    const [{ users }, { domains }] = await Promise.all([
      api("GET", "/admin/users"),
      api("GET", "/admin/domains"),
    ]);
    const names = domains.map((d) => d.name);

    html += `<h2>domains</h2>
      <table><tr><th>name</th><th>created</th><th>delete</th><th></th></tr>
      ${domains.map((d) => `<tr>
        <td><a href="/${esc(encodeURIComponent(d.name))}/_/">${esc(d.name)}</a></td>
        <td>${esc(d.createdAt)}</td>
        <td><input type="checkbox" data-row="domain-${esc(d.name)}"></td>
        <td><button onclick="saveDomain(${str(d.name)})">save</button></td>
      </tr>`).join("")}
      </table>
      <form onsubmit="event.preventDefault(); act(() => api('POST', '/admin/domains', { name: this.elements.n.value }))">
        <input name="n" placeholder="domain" required>
        <button>create domain</button>
      </form>

      <h2>users</h2>
      <table><tr><th>id</th><th>username</th><th>active</th><th>admin</th><th>deleted</th><th>domains</th><th>modified</th><th></th></tr>
      ${users.map((u) => `<tr class="${u.isDeleted ? "del" : ""}">
        <td>${u.id}</td>
        <td>${esc(u.username)}</td>
        <td>${check(u, "isActive")}</td>
        <td>${check(u, "isAdmin")}</td>
        <td>${check(u, "isDeleted")}</td>
        <td>${[...new Set([...names, ...split(u.domain)])].map((d) =>
          `<label>${check(u, "domain", { value: d, checked: split(u.domain).includes(d) })}${esc(d)}</label>`).join(" ")}</td>
        <td>${esc(u.modifiedAt)}</td>
        <td>${saveUserButton(u)}</td>
      </tr>`).join("")}
      </table>
      <form onsubmit="event.preventDefault(); act(() => api('POST', '/admin/users', { username: this.username.value, password: this.password.value, domain: this.domain.value || null, isActive: this.isActive.checked, isAdmin: this.isAdmin.checked }))">
        <input name="username" placeholder="username" required>
        <input name="password" placeholder="password" required>
        <input name="domain" placeholder="domains (a,b)">
        <label><input type="checkbox" name="isActive" checked> active</label>
        <label><input type="checkbox" name="isAdmin"> admin</label>
        <button>create user</button>
      </form>`;

    app.innerHTML = html;
    return;
  }

  // domain page: own data and users with access to this domain
  const data = await api("GET", `/${domain}/data`).then((r) => r.data, (e) => e.message);
  html += "<h2>data (own)</h2>";

  if (typeof data === "string") {
    html += `<p>${esc(data)}</p>`;
  } else {
    html += `<table><tr><th>key</th><th>value</th><th>modified</th><th>delete</th><th></th></tr>
      ${data.map((d) => `<tr>
        <td>${esc(d.key)}</td>
        <td><textarea data-row="data-${esc(d.key)}">${esc(d.value)}</textarea></td>
        <td>${esc(d.modifiedAt)}</td>
        <td><input type="checkbox" data-row="data-${esc(d.key)}"></td>
        <td><button onclick="saveData(${str(d.key)})">save</button></td>
      </tr>`).join("")}
      </table>
      <form onsubmit="event.preventDefault(); act(() => api('POST', '/' + domain + '/data', { key: this.key.value, value: this.value.value }))">
        <input name="key" placeholder="key" required>
        <textarea name="value" placeholder="value"></textarea>
        <button>add / overwrite</button>
      </form>`;
  }

  if (me.isAdmin && typeof data !== "string") {
    const [{ users }, all] = await Promise.all([
      api("GET", `/${domain}/users`),
      api("GET", "/admin/users"),
    ]);
    const others = all.users.filter((u) => !u.isDeleted && !users.some((x) => x.id === u.id));

    html += `<h2>users with access</h2>
      <table><tr><th>id</th><th>username</th><th>active</th><th>admin</th><th>access</th><th></th></tr>
      ${users.map((u) => `<tr>
        <td>${u.id}</td>
        <td>${esc(u.username)}</td>
        <td>${check(u, "isActive")}</td>
        <td>${check(u, "isAdmin")}${check({ ...u, isDeleted: false }, "isDeleted", { hidden: true })}</td>
        <td>${split(u.domain).map((d) => check(u, "domain", { value: d, checked: true, hidden: d !== domain })).join("")}</td>
        <td>${saveUserButton(u)}</td>
      </tr>`).join("")}
      </table>
      <form onsubmit="event.preventDefault(); act(() => api('POST', '/admin/users/' + this.user.value + '/domains', { domain }))">
        <select name="user">${others.map((u) => `<option value="${u.id}">${esc(u.username)}</option>`).join("")}</select>
        <button>grant access</button>
      </form>`;
  }

  app.innerHTML = html;
}

render().catch((e) => token && (app.textContent = e.message));
</script>
</body>
</html>
